// ===========================================================================
//  SCP Atlas - serveur de TEST local (loading screen)
//  Copie automatique vers server/garrysmod/cfg/server.cfg par
//  scripts/setup-gmod-server.ps1 puis scripts/apply-loadingurl.ps1
// ===========================================================================

hostname "SCP ATLAS - Test loading screen"
sv_lan 1
sv_password ""
maxplayers 8

// --- Loading screen -------------------------------------------------------
// L'URL est réécrite automatiquement par scripts/apply-loadingurl.ps1
sv_loadingurl "https://desync76.github.io/scp-atlas-loadingscreen/"

// Le moteur ajoute lui-même : ?steamid=..&mapname=..&maxplayers=..&gamemode=..

// --- Divers ---------------------------------------------------------------
sv_allowcslua 0
sv_region 3
net_maxfilesize 64
sv_downloadurl ""
