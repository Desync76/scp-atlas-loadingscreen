<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SCP Atlas — Chargement</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700&family=Barlow:wght@300;400;500&display=swap">

<link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Fond (image / vidéo plus tard) -->
  <div class="bg" id="bg"></div>
  <div class="vignette"></div>

  <main class="screen">

    <!-- ── Haut gauche : identité ─────────────────────────────────── -->
    <header class="head">
      <h1 class="head-title">Chargement <b id="hostname">SCP Atlas</b></h1>
      <div class="head-sub"  id="gamemode">Zone Atlas</div>
      <div class="head-desc" id="mapline">Station de recherche météorologique.</div>
    </header>

    <!-- ── Gauche milieu : flux de connexion ──────────────────────── -->
    <aside class="feed" id="feed"></aside>

    <!-- ── Centre : anneau de progression + logo animé ────────────── -->
    <div class="loader">

      <svg class="hud" viewBox="0 0 400 400" aria-hidden="true">

        <!-- Équerres de cadrage — fixes -->
        <g class="hud-frame">
          <path d="M26 56V26h30"/>
          <path d="M344 26h30v30"/>
          <path d="M374 344v30h-30"/>
          <path d="M56 374H26v-30"/>
        </g>

        <!-- Rail + comète : le seul élément en rotation -->
        <circle class="hud-rail" cx="200" cy="200" r="122"/>
        <g class="hud-spin">
          <circle class="hud-comet hud-comet--3" cx="200" cy="200" r="122"/>
          <circle class="hud-comet hud-comet--2" cx="200" cy="200" r="122"/>
          <circle class="hud-comet hud-comet--1" cx="200" cy="200" r="122"/>
        </g>

        <!-- Progression réelle -->
        <circle class="hud-track" cx="200" cy="200" r="146"/>
        <circle class="hud-prog"  cx="200" cy="200" r="146" id="s-progress"/>
        <g id="prog-cursor" class="hud-cursor">
          <line x1="200" y1="42" x2="200" y2="64"/>
        </g>

      </svg>

           Ne pas éditer les tracés à la main : relancer le script. -->

           fill-rule="evenodd" role="img" aria-label="SCP Atlas">

      <!-- logo:end -->
        </g>
      </svg>

    </div>

    <!-- ── Bas centre : mot animé + état ──────────────────────────── -->
    <div class="foot">
      <div class="wave" id="wave"></div>
      <div class="foot-meta">
        <span id="progress-text">0 %</span>
        <span class="sep"></span>
        <span id="status">Initialisation</span>
      </div>
    </div>

    <!-- ── Bas gauche : astuce / dossier ──────────────────────────── -->
    <div class="tip">
      <div class="tip-bar"></div>
      <p class="tip-text" id="tip"></p>
    </div>

  </main>

  <script src="js/gmod.js"></script>
  <script src="js/config.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
